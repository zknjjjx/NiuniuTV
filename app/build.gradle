plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    lint { checkReleaseBuilds false; abortOnError false }
    namespace 'com.niuniu.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.niuniu.tv2'
        minSdk 21
        targetSdk 30
        versionCode 68
        versionName '3.0.8'
        multiDexEnabled true
        // 爬虫 jar 里的 .so 和 Python 只有 ARM；x86_64 给模拟器调试用
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml', 'META-INF/*.kotlin_module'] }
    }
    signingConfigs {
        niuniu {
            storeFile rootProject.file('keystore/niuniu.p12')
            storeType 'pkcs12'
            storePassword System.getenv('NN_KEY_PASS') ?: 'niuniutv'
            keyAlias 'niuniu'
            keyPassword System.getenv('NN_KEY_PASS') ?: 'niuniutv'
        }
    }
    flavorDimensions 'dev'
    productFlavors {
        tv { dimension 'dev'; applicationId 'com.niuniu.tv2' }
        phone { dimension 'dev'; applicationId 'com.niuniu.m' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.niuniu
        }
        debug { signingConfig signingConfigs.niuniu }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    applicationVariants.all { v ->
        v.outputs.all { outputFileName = (v.flavorName == 'phone' ? "NiuniuPhone" : "NiuniuTV") + "-${v.versionName}.apk" }
    }
}

dependencies {
    def m3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$m3"
    implementation "androidx.media3:media3-exoplayer-hls:$m3"
    implementation "androidx.media3:media3-ui:$m3"
    implementation "androidx.media3:media3-datasource:$m3"
    implementation "androidx.media3:media3-database:$m3"
    implementation "androidx.annotation:annotation:1.8.2"
    implementation "com.google.zxing:core:3.3.3"
    implementation "androidx.core:core:1.9.0"
    // ---- TVBox 爬虫宿主：jar 爬虫编译时依赖这些类，必须原名保留（不混淆） ----
    implementation project(':quickjs')
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'org.slf4j:slf4j-api:1.7.36'
}

chaquopy {
    defaultConfig {
        version = "3.8"
        buildPython("python3.8")
        pip {
            install "lxml==4.6.3"
            install "ujson==1.35"
            install "pyquery==2.0.0"
            install "requests"
            install "jsonpath"
            install "cachetools"
            install "pycryptodome==3.9.4"
            install "beautifulsoup4"
        }
    }
}
