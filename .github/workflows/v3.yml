name: 妞妞影视 3（测试版）
on:
  push:
    branches: [v3]
    paths-ignore: ["win/**", ".github/workflows/win.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nn-v3
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.8" }
      - name: 更新内置片源快照
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/zknjjjx/tvbox/main/cmstv.json -o /tmp/s.json && python3 -c "import json;json.load(open('/tmp/s.json'))" && cp /tmp/s.json app/src/main/assets/web/sources.json || true
      - run: gradle assembleRelease --no-daemon --stacktrace
      - run: mkdir out && cp app/build/outputs/apk/*/release/*.apk out/ && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3-beta
          name: 妞妞影视 3（测试版）
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: 3.0 测试版：接入 TVBox 接口，jar / JS / Python 爬虫源和采集站一起搜索、测速、自动换源。可直接覆盖安装 2.x。
      - name: 删除旧测试包
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          keep=" $(cd out && echo *.apk) "
          gh api repos/${{ github.repository }}/releases/tags/v3-beta --jq '.assets[] | "\(.id) \(.name)"' | while read id name; do
            case "$keep" in *" $name "*) ;; *) echo "删除 $name"; gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id ;; esac
          done
