name: 妞妞影视 APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: niuniu-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建（java 版，含 armv7 + arm64）
        run: bash ./gradlew assembleJavaRelease --warning-mode none
      - name: 整理 APK
        run: |
          mkdir out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: niuniu-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 妞妞影视 最新版
          make_latest: true
          files: out/*.apk
          body: 每次推送自动构建。N1 盒子、华为鸿蒙电视都装 Niuniu-java.apk。
