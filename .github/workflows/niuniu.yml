name: 妞妞影视 APK

on:
  push:
    branches: [fongmi]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niuniu-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 签名配置（个人侧载用的公开密钥库）
        run: |
          printf 'storeFile=%s\nkeyAlias=niuniu\nstorePassword=niuniutv\n' "$GITHUB_WORKSPACE/keystore/niuniu.p12" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: 构建电视版
        run: ./gradlew --no-configuration-cache assembleLeanbackRelease
      - name: 整理 APK
        run: |
          mkdir out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: niuniu-apk
          path: out/*.apk
      - name: 发布到 Release（latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 妞妞影视 最新版
          prerelease: false
          make_latest: true
          files: out/*.apk
          body: 每次推送自动构建。N1 盒子与鸿蒙电视一般选 armeabi-v7a；64 位系统可选 arm64-v8a。
