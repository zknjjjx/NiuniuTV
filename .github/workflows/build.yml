name: 妞妞影视 v2
on:
  push:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nn-v2
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python ci/shot.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots/ }
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: 更新内置片源快照
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/zknjjjx/tvbox/main/cmstv.json -o /tmp/s.json && python3 -c "import json;json.load(open('/tmp/s.json'))" && cp /tmp/s.json app/src/main/assets/web/sources.json || true
      - run: gradle assembleRelease --no-daemon
      - run: mkdir out && cp app/build/outputs/apk/release/*.apk out/NiuniuTV.apk && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-latest
          name: 妞妞影视 2（全新界面）
          prerelease: false
          make_latest: true
          files: out/*.apk
          body: 全新电视界面：豆瓣海报墙、详情简介与演员，自动测速挑最快片源，播放失败或卡顿自动换源。N1 和华为电视都装这一个。
