name: 妞妞影视 v2
on:
  push:
    branches: [v2]
    paths-ignore: ["win/**", ".github/workflows/win.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nn-v2
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python ci/shot.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots/ }
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: 更新内置片源快照
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/zknjjjx/tvbox/main/cmstv.json -o /tmp/s.json && python3 -c "import json;json.load(open('/tmp/s.json'))" && cp /tmp/s.json app/src/main/assets/web/sources.json || true
      - run: gradle assembleRelease --no-daemon
      - run: mkdir out && cp app/build/outputs/apk/*/release/*.apk out/ && ls -la out
      - name: 生成升级信息 latest.json
        run: |
          python3 - <<'PY'
          import json, re, glob, os, subprocess
          g = open("app/build.gradle").read()
          v = re.search(r"versionName '([^']+)'", g).group(1)
          c = int(re.search(r"versionCode (\d+)", g).group(1))
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"]).decode().strip()
          for pre, js in (("NiuniuTV", "latest.json"), ("NiuniuPhone", "latest-m.json")):
              apk = os.path.basename(glob.glob(f"out/{pre}-*.apk")[0])
              json.dump({"version": v, "code": c, "apk": apk, "notes": msg}, open("out/" + js, "w"), ensure_ascii=False)
              print(open("out/" + js).read())
          PY
      - name: 固定文件名（分享出去的链接不随版本失效）
        run: cp out/NiuniuTV-*.apk out/NiuniuTV.apk && cp out/NiuniuPhone-*.apk out/NiuniuPhone.apk && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-latest
          name: 妞妞影视 2（正式版）
          prerelease: false
          make_latest: true
          files: |
            out/*.apk
            out/latest.json
            out/latest-m.json
          body: 全新电视界面：豆瓣海报墙、详情简介与演员，自动测速挑最快片源，播放失败或卡顿自动换源。电视（N1、华为等）装 NiuniuTV，安卓手机装 NiuniuPhone。2.6.0 起 App 内可检查更新、一键升级，安装包装完自动删除。
      - name: 删除旧版本安装包
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          keep=" $(cd out && echo *.apk) latest.json latest-m.json "
          gh api repos/${{ github.repository }}/releases/tags/v2-latest --jq '.assets[] | "\(.id) \(.name)"' | while read id name; do
            case "$name" in NiuniuWin-*) continue;; esac
            case "$keep" in *" $name "*) ;; *) echo "删除 $name"; gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id ;; esac
          done
